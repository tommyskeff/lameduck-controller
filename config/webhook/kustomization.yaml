resources:
- manifests.yaml
- service.yaml

patches:
- patch: |-
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingWebhookConfiguration
    metadata:
      name: validating-webhook-configuration
    webhooks:
    - name: pod-delete.lameduck.tommyjs.dev
      objectSelector:
        matchExpressions:
        - key: lameduck.tommyjs.dev/set
          operator: Exists
    - name: pod-eviction.lameduck.tommyjs.dev
      namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
          - kube-system
          - lameduck-system
