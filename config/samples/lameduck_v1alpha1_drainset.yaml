apiVersion: lameduck.tommyjs.dev/v1alpha1
kind: DrainSet
metadata:
  name: echo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
      - name: echo
        image: nginx:1.29-alpine
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
  rollout:
    maxSurge: 1
    maxUnavailable: 0
    maxDraining: 1
  drain:
    timeouts:
      rollout: 2m
      scaleDown: 2m
      eviction: 1m
      manual: 1m
---
apiVersion: v1
kind: Service
metadata:
  name: echo
spec:
  selector:
    app: echo
    lameduck.tommyjs.dev/routable: "true"
  ports:
  - name: http
    port: 80
    targetPort: http
