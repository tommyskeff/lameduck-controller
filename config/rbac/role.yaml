---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - controllerrevisions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - lameduck.tommyjs.dev
  resources:
  - drainsets
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - lameduck.tommyjs.dev
  resources:
  - drainsets/finalizers
  verbs:
  - update
- apiGroups:
  - lameduck.tommyjs.dev
  resources:
  - drainsets/status
  verbs:
  - get
  - patch
  - update
