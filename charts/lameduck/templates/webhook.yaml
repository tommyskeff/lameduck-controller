{{- if .Values.webhook.enabled }}
{{- $service := include "lameduck.webhookService" . }}
{{- $secretName := include "lameduck.webhookSecret" . }}
{{- $caBundle := "" }}
{{- if .Values.webhook.certManager.enabled }}
{{- if not .Values.webhook.certManager.issuerRef }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "lameduck.fullname" . }}-selfsigned
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lameduck.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "lameduck.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lameduck.labels" . | nindent 4 }}
spec:
  secretName: {{ $secretName }}
  dnsNames:
  - {{ $service }}.{{ .Release.Namespace }}.svc
  - {{ $service }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    {{- if .Values.webhook.certManager.issuerRef }}
    {{- toYaml .Values.webhook.certManager.issuerRef | nindent 4 }}
    {{- else }}
    kind: Issuer
    name: {{ include "lameduck.fullname" . }}-selfsigned
    {{- end }}
{{- else }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $crt := "" }}
{{- $key := "" }}
{{- if and $existing (index ($existing.data | default dict) "ca.crt") }}
{{- $caBundle = index $existing.data "ca.crt" }}
{{- $crt = index $existing.data "tls.crt" }}
{{- $key = index $existing.data "tls.key" }}
{{- else }}
{{- $ca := genCA (printf "%s-ca" (include "lameduck.fullname" .)) 3650 }}
{{- $dns := list (printf "%s.%s.svc" $service .Release.Namespace) (printf "%s.%s.svc.cluster.local" $service .Release.Namespace) }}
{{- $cert := genSignedCert (index $dns 0) nil $dns 3650 $ca }}
{{- $caBundle = $ca.Cert | b64enc }}
{{- $crt = $cert.Cert | b64enc }}
{{- $key = $cert.Key | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lameduck.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $caBundle }}
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
{{- end }}
---
{{- $config := .Files.Get "files/webhooks.yaml" | fromYaml }}
{{- $webhooks := list }}
{{- range $config.webhooks }}
{{- $webhook := . }}
{{- $_ := set $webhook.clientConfig.service "name" $service }}
{{- $_ := set $webhook.clientConfig.service "namespace" $.Release.Namespace }}
{{- if $caBundle }}
{{- $_ := set $webhook.clientConfig "caBundle" $caBundle }}
{{- end }}
{{- if hasPrefix "pod-" $webhook.name }}
{{- $_ := set $webhook "failurePolicy" $.Values.webhook.podFailurePolicy }}
{{- end }}
{{- if eq $webhook.name "pod-delete.lameduck.tommyjs.dev" }}
{{- $_ := set $webhook "objectSelector" (dict "matchExpressions" (list (dict "key" "lameduck.tommyjs.dev/set" "operator" "Exists"))) }}
{{- end }}
{{- $webhooks = append $webhooks $webhook }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "lameduck.fullname" . }}
  labels:
    {{- include "lameduck.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "lameduck.fullname" . }}-webhook
  {{- end }}
webhooks:
  {{- toYaml $webhooks | nindent 2 }}
{{- end }}
