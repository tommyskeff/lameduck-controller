syntax = "proto3";

package tommyjs.lameduck.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/tommyskeff/lameduck-controller/pkg/proto/lameduckv1;lameduckv1";
option java_multiple_files = true;
option java_package = "dev.tommyjs.lameduck.v1";

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_STARTING = 1;
  PHASE_ACTIVE = 2;
  PHASE_DRAINING = 3;
}

enum DrainReason {
  DRAIN_REASON_UNSPECIFIED = 0;
  DRAIN_REASON_ROLLOUT = 1;
  DRAIN_REASON_SCALE_DOWN = 2;
  DRAIN_REASON_EVICTION = 3;
  DRAIN_REASON_MANUAL = 4;
}

message PodState {
  Phase phase = 1;
  DrainReason drain_reason = 2;
  google.protobuf.Timestamp drain_deadline = 3;
  bool current = 4;
  bool routable = 5;
  string revision = 6;
}
