name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make lint-config
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test
      - name: Generated files are committed
        run: |
          make chart
          git diff --exit-code

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: lameduck-e2e
      - run: make test-e2e
      - name: Controller logs
        if: failure()
        run: |
          kubectl -n lameduck-system get pods -o wide
          kubectl -n lameduck-system logs -l app.kubernetes.io/instance=lameduck --all-containers --prefix --tail=-1
          kubectl -n lameduck-e2e get pods -o yaml
          kubectl -n lameduck-e2e logs -l app=drain-app --all-containers --prefix --tail=-1

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
      - run: helm lint charts/lameduck
      - run: helm template lameduck charts/lameduck --namespace lameduck-system > /dev/null
