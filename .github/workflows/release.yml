name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/tommyskeff/lameduck-controller
  HELM_REPOSITORY: https://repo.tommyjs.dev/repository/helm/

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
      - name: Package chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/lameduck --version "$version" --app-version "$GITHUB_REF_NAME" --destination dist
      - name: Upload chart
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          curl --fail-with-body --user "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            --upload-file dist/lameduck-*.tgz "$HELM_REPOSITORY"
